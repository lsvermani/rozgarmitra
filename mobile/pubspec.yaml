name: rozgarmitra
description: Rozgarmitra - Local Jobs & Daily-Wage Worker Platform
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2            # simple state management
  http: ^1.2.2                # REST API calls
  shared_preferences: ^2.3.2  # persist auth token / language locally
  geolocator: ^13.0.1         # device GPS (falls back to manual location if unavailable)
  image_picker: ^1.1.2        # profile photo / job photos
  intl: ^0.20.3                # date/time formatting, i18n
  flutter_localizations:
    sdk: flutter
  go_router: ^14.3.0          # declarative navigation
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  flutter_secure_storage: ^11.2.0  # encrypted store for server config + admin passcode
  crypto: ^3.0.7                    # PBKDF2-HMAC-SHA256 for the recovery passcode

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
