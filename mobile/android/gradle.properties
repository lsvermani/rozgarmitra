# Heap sizing note: this project's original -Xmx8G / -XX:MaxMetaspaceSize=4G came
# from the Flutter template and is larger than the whole RAM of a modest dev
# machine (8 GB). Gradle then fails to even reserve its own heap and the daemon
# JVM dies with "Native memory allocation (malloc) failed" / "daemon
# disappeared". The Dart AOT snapshot runs in its own process, so 2G here is
# plenty for this app. Raise these only on a machine with more RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Build one module at a time: parallel workers multiply peak memory on small machines.
org.gradle.parallel=false
org.gradle.workers.max=1
# Keep the daemon off on CI/low-memory machines: `flutter build ... --no-daemon`.
org.gradle.daemon=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
