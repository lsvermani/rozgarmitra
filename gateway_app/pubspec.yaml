name: gateway_app
description: "Rozgarmitra SMS gateway - sends queued OTPs from the phone holding the SIM."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # HTTPS to this project's own backend. Nothing else.
  http: ^1.2.0

  # Keeps the device bearer token out of plain preferences. That token authorises
  # sending SMS from the user's SIM, so it must not sit in unencrypted storage on
  # a device that is likely to be unattended.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
